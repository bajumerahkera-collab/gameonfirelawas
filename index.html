<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Jam Gacor & Pola Terupdate</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.85);
            --bg-inner: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-pragmatic: #f59e0b;
            --accent-pgsoft: #06b6d4;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1; 
        }

        header {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(30, 27, 187, 0.4) 100%);
            border: 1px solid #312e81;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); 
        }

        header h1 {
            margin: 0 0 10px 0;
            color: var(--accent-pragmatic);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .time-banner {
            background-color: var(--bg-card);
            border: 1px solid var(--bg-inner);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        .time-banner span {
            color: var(--text-muted);
            font-weight: bold;
        }

        .grid-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        .grid-table th {
            background-color: var(--bg-inner);
            padding: 14px;
            text-align: left;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #fff;
        }

        .grid-table td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--bg-inner);
            vertical-align: middle;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-info img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--bg-inner);
            border: 2px solid #374151;
        }

        .game-name {
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
        }

        .bar-container {
            width: 100%;
            background-color: #374151;
            border-radius: 20px;
            height: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #4b5563;
        }

        .bar-fill {
            height: 100%;
            border-radius: 20px;
            width: 0%;
            transition: width 1s ease-in-out, background-color 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #000;
            font-weight: 800;
            font-size: 0.8rem;
            background: linear-gradient(90deg, #3b82f6, var(--success));
        }

        .pola-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pola-text {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-main);
            padding: 8px 12px;
            border-radius: 6px;
            color: #a7f3d0;
            font-size: 0.9rem;
            border: 1px solid var(--bg-inner);
        }

        .btn-copy {
            align-self: flex-start;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-copy:hover { background-color: #4338ca; }
        .btn-copy.copied { background-color: var(--success); }

        .section-title {
            font-size: 1.5rem;
            margin: 35px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .pragmatic-title { color: var(--accent-pragmatic); }
        .pgsoft-title { color: var(--accent-pgsoft); }

        @media (max-width: 768px) {
            .grid-table th, .grid-table td { padding: 10px; }
            .grid-table tr { display: block; margin-bottom: 15px; border: 1px solid var(--bg-inner); border-radius: 8px; }
            .grid-table td { display: block; width: 100%; box-sizing: border-box; text-align: right; border-bottom: 1px dashed var(--bg-inner); }
            .grid-table td::before { content: attr(data-label); float: left; font-weight: bold; color: var(--text-muted); }
            .grid-table td:last-child { border-bottom: none; }
            .game-info { justify-content: flex-end; }
            .pola-wrapper { align-items: flex-end; }
            .btn-copy { align-self: flex-end; }
            th { display: none; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <header>
        <div class="live-badge">● LIVE AUTO UPDATE</div>
        <h1>Sistem Pola & Jam Gacor Harian</h1>
        <p>Game on fire Selalu Update setiap hari</p>
    </header>

    <div class="section-title pragmatic-title">🎰 PRAGMATIC PLAY</div>
    <div class="time-banner">
        <span>⏱️ Jam Gacor Hari Ini:</span> <span id="jam-pragmatic" style="color: #fff;">Memuat...</span>
    </div>
    <table class="grid-table">
        <thead>
            <tr>
                <th style="width: 35%;">Game On Fire Hari Ini</th>
                <th style="width: 25%;">Live RTP harian</th>
                <th style="width: 40%;">Rekomendasi Pola</th>
            </tr>
        </thead>
        <tbody id="pragmatic-list"></tbody>
    </table>

    <div class="section-title pgsoft-title">📱 PG SOFT</div>
    <div class="time-banner">
        <span>⏱️ Jam Gacor Hari Ini:</span> <span id="jam-pgsoft" style="color: #fff;">Memuat...</span>
    </div>
    <table class="grid-table">
        <thead>
            <tr>
                <th style="width: 35%;">Game On Fire Hari Ini</th>
                <th style="width: 25%;">Live RTP harian</th>
                <th style="width: 40%;">Rekomendasi Pola</th>
            </tr>
        </thead>
        <tbody id="pgsoft-list"></tbody>
    </table>
</div>

<script>
    
    const pragmaticPool = [
        { name: "Gates of Olympus", img: "https://img.viva88athenae.com/pp/images/vs20olympgate.png" },
        { name: "Sweet Bonanza", img: "https://img.viva88athenae.com/pp/images/vs20fruitsw-t.png" },
        { name: "Starlight Princess", img: "https://img.viva88athenae.com/pp/images/vs20starlight.png" },
        { name: "Sugar Rush 1000", img: "https://img.viva88athenae.com/pp/images/vs20sugarrushx.png" },
        { name: "Wild West Gold", img: "https://img.viva88athenae.com/pp/images/vs40wildwest-t.png" },
        { name: "Pyramid Bonanza", img: "https://img.viva88athenae.com/pp/images/vs20pbonanza.png" },
        { name: "Gates of Gatot Kaca", img: "https://img.viva88athenae.com/pp/images/vs20gatotgates.png" },
        { name: "5 Lions Megaways", img: "https://img.viva88athenae.com/pp/images/vswayslions.png" },
        { name: "Candy Rush", img: "https://img.viva88athenae.com/pp/images/vs20candyia.png" },
        { name: "Jelly Express", img: "https://img.viva88athenae.com/pp/images/vs20payanyvol.png" },
        { name: "Sweet Bonanza 2500", img: "https://img.viva88athenae.com/pp/images/vs20swbon2500.png" },
        { name: "Gates Of Olympus Super Scatter", img: "https://img.viva88athenae.com/pp/images/vs20olympgold.png" },
        { name: "Mahjong Wins 3 - Black Scatter", img: "https://img.viva88athenae.com/pp/images/vswaysmahwblck.png" },
        { name: "Sweet Bonanza 1000", img: "https://img.viva88athenae.com/pp/images/vs20fruitswx.png" },
        { name: "Fortune of Olympus", img: "https://img.viva88athenae.com/pp/images/vs20olympgcl.png" },
        { name: "Gates Of Gatot Kaca Super Scatter", img: "https://img.viva88athenae.com/pp/images/vs20olgatssc.png" },
        { name: "Sweet Bonanza Super Scatter", img: "https://img.viva88athenae.com/pp/images/vs20swbonsup.png" },
        { name: "Sugar Rush Super Scatter", img: "https://img.viva88athenae.com/pp/images/vs20sugrushss.png" }
    ];

    const pgPool = [
        { name: "Mahjong Ways 2", img: "https://img.viva88athenae.com/pg/images/mahjong-ways2.png" },
        { name: "Wild Bandito", img: "https://img.viva88athenae.com/pg/images/wild-bandito.png" },
        { name: "Lucky Neko", img: "https://img.viva88athenae.com/pg/images/lucky-neko.png" },
        { name: "Treasures of Aztec", img: "https://img.viva88athenae.com/pg/images/treasures-aztec.png" },
        { name: "Leprechaun Riches", img: "assets/img/leprechaun.png" },
        { name: "Caishen Wins", img: "https://img.viva88athenae.com/pg/images/cai-shen-wins.png" },
        { name: "Ganesha Fortune", img: "https://img.viva88athenae.com/pg/images/ganesha-fortune.png" },
        { name: "Dreams of Macau", img: "https://img.viva88athenae.com/pg/images/dreams-of-macau.png" },
        { name: "Wild Bounty Showdown", img: "https://img.viva88athenae.com/pg/images/wild-bounty-showdown.png" },
        { name: "Mahjong Ways 1", img: "https://img.viva88athenae.com/pg/images/mahjong-ways.png" }
    ];

    const pragmaticSpins = ["10x Manual Cepat", "20x Manual Normal", "30x Turbo (DC On)", "40x Turbo (DC Off)", "15x Auto Cepat", "50x Turbo (DC On)", "25x Fast Spin"];
    const pgSpins = ["10x Manual (No Turbo)", "20x Auto Normal", "30x Auto Turbo", "15x Spasi Manual", "50x Auto Turbo", "40x Manual Mix"];

    function getSeedBasedRandom(seed) {
        const x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
    }

    function generateDailyData() {
        const today = new Date();
        const daySeed = today.getDate() + ((today.getMonth() + 1) * 31) + today.getFullYear();

        const pragJam1 = Math.floor(8 + getSeedBasedRandom(daySeed) * 4);
        const pragJam2 = Math.floor(19 + getSeedBasedRandom(daySeed + 1) * 4);
        document.getElementById('jam-pragmatic').textContent = `03:20-05:00 WIB | ${pragJam1}:15-14:30 WIB | ${pragJam2}:00-23:45 WIB`;

        const pgJam1 = Math.floor(9 + getSeedBasedRandom(daySeed + 2) * 3);
        const pgJam2 = Math.floor(21 + getSeedBasedRandom(daySeed + 3) * 3);
        document.getElementById('jam-pgsoft').textContent = `02:00-04:30 WIB | ${pgJam1}:00-11:45 WIB | ${pgJam2}:15-01:00 WIB`;

        renderAutoList("pragmatic-list", pragmaticPool, pragmaticSpins, daySeed, true);
        renderAutoList("pgsoft-list", pgPool, pgSpins, daySeed + 100, false);

        setTimeout(() => {
            document.querySelectorAll(".bar-fill").forEach(bar => {
                bar.style.width = bar.getAttribute("data-target") + "%";
            });
        }, 200);
    }

    function renderAutoList(elementId, gamePool, spinPool, baseSeed, isPragmatic) {
        const container = document.getElementById(elementId);
        if (!container) return;
        container.innerHTML = "";

        let gameListWithRandom = gamePool.map((game, idx) => {
            return { game: game, randomVal: getSeedBasedRandom(baseSeed + idx) };
        });
        
        gameListWithRandom.sort((a, b) => a.randomVal - b.randomVal);
        let dailyFiveGames = gameListWithRandom.slice(0, 5).map(item => item.game);

        dailyFiveGames.forEach((game, index) => {
            const seed = baseSeed + index + 5;
            const dailyRtp = Math.floor(85 + (getSeedBasedRandom(seed) * 10)); 

            const step1 = spinPool[Math.floor(getSeedBasedRandom(seed + 12) * spinPool.length)];
            const step2 = spinPool[Math.floor(getSeedBasedRandom(seed + 24) * spinPool.length)];
            const suffix = isPragmatic ? " → Incar Buy Spin" : " → Mainkan Bet Naik-Turun";
            const fullPola = `${step1} → ${step2}${suffix}`;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td data-label="Game On Fire Hari Ini">
                    <div class="game-info">
                        <img src="${game.img}" alt="${game.name}" onerror="this.src='https://placehold.co/55x55/1f2937/ffffff?text=SLOT'">
                        <div class="game-name">${game.name}</div>
                    </div>
                </td>
                <td data-label="Live RTP harian">
                    <div class="bar-container">
                        <div class="bar-fill" data-target="${dailyRtp}">${dailyRtp}%</div>
                    </div>
                </td>
                <td data-label="Rekomendasi Pola">
                    <div class="pola-wrapper">
                        <div class="pola-text">${fullPola}</div>
                        <button class="btn-copy" onclick="copyPattern(this, '${fullPola}')">Salin Pola</button>
                    </div>
                </td>
            `;
            container.appendChild(row);
        });
    }

    function copyPattern(button, text) {
        navigator.clipboard.writeText(text).then(() => {
            button.textContent = "Tersalin!";
            button.classList.add("copied");
            setTimeout(() => {
                button.textContent = "Salin Pola";
                button.classList.remove("copied");
            }, 1500);
        });
    }


    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const colors = ['#f59e0b', '#06b6d4', '#10b981', '#4f46e5']; 

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5; 
            this.speedX = (Math.random() - 0.5) * 0.3; 
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.alpha = Math.random() * 0.5 + 0.1;
            this.fadeSpeed = Math.random() * 0.005 + 0.002;
        }

        update() {
            this.x += this.speedX;
            this.y += this.speedY;

            
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    function initParticles() {
        particles = [];
        const quantity = Math.min(60, window.innerWidth / 20);
        for (let i = 0; i < quantity; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    
    window.addEventListener("DOMContentLoaded", () => {
        generateDailyData();
        initParticles();
        animate();
    });
</script>
    <script>
  // 1. Blokir Klik Kanan (Context Menu)
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert("no no no ya jangan mencurii");
  });

  // 2. Blokir Tombol F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J, dan Ctrl+S
  document.addEventListener('keydown', function(e) {
    
    // Blokir F12
    if (e.key === "F12" || e.keyCode === 123) {
      e.preventDefault();
      alert("no no no ya jangan mencurii");
      return false;
    }

    // Blokir Kombinasi Ctrl + U (View Source)
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
      e.preventDefault();
      alert("no no no ya jangan mencurii");
      return false;
    }

    // Blokir Kombinasi Ctrl + Shift + I (Inspect Element)
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.keyCode === 73)) {
      e.preventDefault();
      alert("no no no ya jangan mencurii");
      return false;
    }

    // Blokir Kombinasi Ctrl + Shift + J (Console)
    if (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J' || e.keyCode === 74)) {
      e.preventDefault();
      alert("no no no ya jangan mencurii");
      return false;
    }

    // Blokir Kombinasi Ctrl + S (Save Page)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
      e.preventDefault();
      alert("no no no ya jangan mencurii");
      return false;
    }
  });
</script>
</body>
</html>
